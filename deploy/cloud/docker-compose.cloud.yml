services:
  # This overlay is the only Internet-facing Compose path. Do not inherit a
  # local stage/no-auth profile: app startup must fail closed without real
  # production credentials and an allowed production network profile.
  app:
    environment:
      APP_ENV: "production"
      AUTH_ENABLED: "true"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/cloud/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
