<form class="toolbar" method="get" aria-label="Фильтры отчёта">
<label>Период<select name="days">{% for n in [7,30,90] %}<option value="{{ n }}" {{ 'selected' if data.days == n else '' }}>{{ n }} дней</option>{% endfor %}</select></label>
<label>Площадка<select name="source"><option value="">Все площадки</option><option value="auto_ru" {{ 'selected' if data.source == 'auto_ru' else '' }}>Auto.ru</option><option value="avito" {{ 'selected' if data.source == 'avito' else '' }}>Avito</option></select></label>
<label>Марка<select name="brand"><option value="">Все марки</option>{% for b in data.brands %}<option value="{{ b }}" {{ 'selected' if data.brand == b else '' }}>{{ b }}</option>{% endfor %}</select></label>
<label>Реестр<select name="scope"><option value="active">Активные</option><option value="all" {{ 'selected' if data.scope == 'all' else '' }}>Включая архив</option></select></label>
<label class="grow">Автомобиль<input name="q" value="{{ data.q }}" placeholder="VIN или модель"></label>
{% if active_page == 'placements' %}<label>Результат<select name="status"><option value="">Все результаты</option>{% for key,value in data.states.items() %}<option value="{{ key }}" {{ 'selected' if data.status == key else '' }}>{{ value }}</option>{% endfor %}</select></label>{% endif %}
<button class="primary" type="submit">Применить</button><a class="text-link" href="/api/v1/dashboard{{ '/' + active_page if active_page else '' }}">Сбросить</a>
</form>
