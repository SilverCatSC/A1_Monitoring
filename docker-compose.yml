services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      POSTGRES_DB: a1_search_monitor
    ports:
      - "127.0.0.1:${DB_BIND_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d a1_search_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: "postgresql+psycopg2://monitor:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/a1_search_monitor"
      APP_TZ: Europe/Moscow
      PLAYWRIGHT_HEADLESS: "true"
      SCAN_PAGES_LIMIT: 3
      SCAN_INTERVAL_MINUTES: 360
      APP_ENV: "${APP_ENV:-stage}"
      COMPANY_SITE_AUDIT_DIR: /app/company_site_audits
      HEAD_TABLE_AUDIT_DIR: /app/head_table_audits
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8000}:8000"
    command: >
      /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    volumes:
      # A local Chrome worker writes screenshots on the host; the dashboard
      # reads the same files through this bind mount.
      - ./artifacts/evidence:/app/artifacts
      # Host-side read-only catalogue audit; it is never written by the web container.
      - ./artifacts/company_site_audits:/app/company_site_audits:ro
      # Latest read-only marketing-table snapshot for the sales-facing report.
      - ./artifacts/head_table_audits:/app/head_table_audits:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: monitor
      PGPASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      PGDATABASE: a1_search_monitor
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        mkdir -p /backups
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          temporary="/backups/a1_search_monitor_$${stamp}.dump.tmp"
          target="/backups/a1_search_monitor_$${stamp}.dump"
          pg_dump --format=custom --file="$${temporary}"
          mv "$${temporary}" "$${target}"
          sha256sum "$${target}" > "$${target}.sha256.tmp"
          mv "$${target}.sha256.tmp" "$${target}.sha256"
          find /backups -type f \( -name 'a1_search_monitor_*.dump' -o -name 'a1_search_monitor_*.dump.sha256' \) -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    volumes:
      - db_backups:/backups

volumes:
  db_data:
  db_backups:
