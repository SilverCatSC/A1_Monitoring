services:
  db:
    image: postgres:16-alpine
    container_name: a1-monitor-db
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: a1_search_monitor
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d a1_search_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: a1-monitor-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: postgresql+psycopg2://monitor:monitor@db:5432/a1_search_monitor
      APP_TZ: Europe/Moscow
      PLAYWRIGHT_HEADLESS: "true"
      SCAN_PAGES_LIMIT: 3
      SCAN_INTERVAL_MINUTES: 360
      APP_ENV: production
    ports:
      - "8000:8000"
    command: >
      /bin/sh -c "python -m app.cli init && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - evidence:/app/artifacts

volumes:
  db_data:
  evidence:
