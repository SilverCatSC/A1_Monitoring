[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a1-search-monitor"
version = "0.9.0"
description = "Local-browser monitoring stack for used car listing visibility on Avito and Auto.ru"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "alembic>=1.13",
  "pandas>=2.2",
  "playwright>=1.46",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "tenacity>=8.3",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "python-dateutil>=2.9",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic", "venv", ".venv", ".venv312", ".tmp_smoke_env", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "single"
